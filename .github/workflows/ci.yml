name: Beautiful Jekyll CI
on:
  push:
  pull_request:

jobs:
  build:
    name: Build Jekyll
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Smoke-build with jekyll/builder. --future allows dated-ahead posts.
      - name: Build site (jekyll/builder)
        run: |
          mkdir -p _site
          docker run --rm \
            -v "${{ github.workspace }}:/srv/jekyll" \
            -e PAGES_REPO_NWO="${{ github.repository }}" \
            jekyll/builder:3.8 \
            /bin/bash -c "chmod -R a+w /srv/jekyll && jekyll build --future"

      - name: Verify build output
        run: |
          test -f _site/index.html
          ls _site | head -n 40
          echo "Jekyll CI build OK"
