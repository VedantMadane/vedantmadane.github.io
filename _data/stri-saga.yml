- chapter_id: 1
  title_sa: पारिभाषिक-शब्दावली
  terms:
  - term_sa: प्रवृत्तिविद्या
- chapter_id: 2
  title_sa: मार्गसाहसप्रकरणम्
  verses:
  - verse_id: 1
    title_sa: आह्वानम्
    meter: अनुष्टुभ्
    sanskrit: 'पुरतः सम्मुखे स्थित्वा निर्भयः शान्तमानसः ।

      स्तुवीत ऋजुवाक्येन तस्याः सौन्दर्यमुत्तमम् ॥ १ ॥

      '
  - verse_id: 2
    title_sa: आरोपः
    meter: अनुष्टुभ्
    sanskrit: 'नीरसान् वर्जयेत् प्रश्नान् अनुमानं प्रयुञ्जयेत् ।

      स्वभावे वेषभूषायां कुर्यादारोपमुत्तमम् ॥ २ ॥

      '
  - verse_id: 3
    title_sa: विहारः
    meter: अनुष्टुभ्
    sanskrit: 'क्रीडाभावं ततो रक्षेत् प्रतापं चाप्यखण्डितम् ।

      परीक्षया न विचलितो निरातङ्कः स सल्लपेत् ॥ ३ ॥

      '
  - verse_id: 4
    title_sa: समापनम्
    meter: अनुष्टुभ्
    sanskrit: 'दीर्घकालं न तिष्ठेत् तु सङ्केतं विनिश्चित्य च ।

      सम्पर्कसूत्रमादाय गच्छेत् स्वकार्यसिद्धये ॥ ४ ॥

      '
- chapter_id: 3
  title_sa: परीक्षाप्रकरणम्
  verses:
  - verse_id: 1
    title_sa: परीक्षा-सिद्धान्तः
    meter: अनुष्टुभ्
    sanskrit: 'प्रतापं वेदितुं नारी करोति छद्मप्रश्ननम् ।

      न द्वेषान्नापि दोषात् तत् प्रकृत्या एव जायते ॥ १ ॥

      '
  - verse_id: 2
    title_sa: आज्ञापरीक्षा
    meter: अनुष्टुभ्
    sanskrit: 'आज्ञां ददाति या क्षुद्रां विनीतं कुरुते नरम् ।

      आज्ञया यो वशीभूतः प्रतापं स हि मार्जति ॥ २ ॥

      '
  - verse_id: 3
    title_sa: स्वभावपरीक्षा
    meter: अनुष्टुभ्
    sanskrit: 'निन्दां करोति रूपस्य स्वभावस्य च लीलया ।

      क्रुद्धो वा स्पष्टीकरणे प्रवृत्तो विजितस्तया ॥ ३ ॥

      '
  - verse_id: 4
    title_sa: असूयापरीक्षा
    meter: अनुष्टुभ्
    sanskrit: 'कथयत्यन्यपुंसश्च स्पर्धार्थं मोहनाय च ।

      असूयया यदा तप्तः तदा तस्य पराजयः ॥ ४ ॥

      '
  - verse_id: 5
    title_sa: परीक्षाच्छेदः
    meter: अनुष्टुभ्
    sanskrit: 'उपहासेन शान्त्या वा परीक्षामतितर्ति यः ।

      स्वमार्गे योऽविचलितः स एव पुरुषोत्तमः ॥ ५ ॥

      '
- chapter_id: 4
  title_sa: सम्पर्कप्रकरणम्
  verses:
  - verse_id: 1
    title_sa: सम्पर्क-आरम्भः
    meter: अनुष्टुभ्
    sanskrit: 'सम्पर्कं प्रथमे कुर्यात् परिहासेन संयुतम् ।

      न दैन्यं दर्शयेत् प्राज्ञः न च कुर्यात् विलम्बनम् ॥ १ ॥

      '
  - verse_id: 2
    title_sa: यन्त्रलेखन-नियमः
    meter: अनुष्टुभ्
    sanskrit: 'यन्त्रलेखो हि सङ्केतं निश्चितुं केवलं स्मृतः ।

      न वार्तालापहेतोः स न च तोषणकर्मणे ॥ २ ॥

      '
  - verse_id: 3
    title_sa: सङ्केतादेशः
    meter: अनुष्टुभ्
    sanskrit: 'स्थानादिकं स्वयं कृत्वा तत्रागन्तुं समादिशेत् ।

      न पृच्छेत् तदनुज्ञां वा निर्भयः स्वयमाचरेत् ॥ ३ ॥

      '
  - verse_id: 4
    title_sa: मौनविधानम्
    meter: अनुष्टुभ्
    sanskrit: 'प्रत्युत्तरं यदा नास्ति मौनमेवावलम्बयेत् ।

      प्राचुर्यं मानसे धृत्वा न कुर्यात् प्रश्नमुत्तरम् ॥ ४ ॥

      '
- chapter_id: 5
  title_sa: समागमप्रकरणम्
  verses:
  - verse_id: 1
    title_sa: पार्श्वोपवेशनम्
    meter: अनुष्टुभ्
    sanskrit: 'स्वयं निश्चित्य वै स्थानं पार्श्वे तस्या उपविशेत् ।

      सम्मुखे न च तिष्ठेत् सः परीक्षां तु विवर्जयेत् ॥ १ ॥

      '
  - verse_id: 2
    title_sa: स्थानपरिवर्तनम्
    meter: अनुष्टुभ्
    sanskrit: 'एकत्र न चिरं तिष्ठेत् नवन्यानुभवं सृजेत् ।

      नेतृत्वमक्षतं रक्षन् स्वयमेव हि मार्गयेत् ॥ २ ॥

      '
  - verse_id: 3
    title_sa: स्पर्शारोहणम्
    meter: अनुष्टुभ्
    sanskrit: 'स्पर्शं क्रमेण वर्धेत निर्भयः सहजस्तथा ।

      अनुज्ञां न च याचेत स्वभावादेव सञ्चरेत् ॥ ३ ॥

      '
  - verse_id: 4
    title_sa: फलासक्तिवर्जनम्
    meter: अनुष्टुभ्
    sanskrit: 'समागमे फलासक्तिं त्यक्त्वा तिष्ठति यो नरः ।

      प्राचुर्यं मानसे धृत्वा स एव विजयी भवेत् ॥ ४ ॥

      '
- chapter_id: 6
  title_sa: आकर्षणप्रकरणम्
  verses:
  - verse_id: 1
    title_sa: बीजारोपणम्
    meter: अनुष्टुभ्
    sanskrit: 'पूर्वं कथाप्रसङ्गेषु स्वगृहस्य कुतूहलम् ।

      जनयेत् सहजं प्राज्ञो न कामं तत्र दर्शयेत् ॥ १ ॥

      '
  - verse_id: 2
    title_sa: छद्मकारणम्
    meter: अनुष्टुभ्
    sanskrit: 'सत्याभिप्रायमाच्छाद्य दद्यात् कारणमुत्तमम् ।

      चित्तस्य रक्षणार्थं हि छद्मवाक्यं प्रयुञ्जयेत् ॥ २ ॥

      '
  - verse_id: 3
    title_sa: नेतृत्वम्
    meter: अनुष्टुभ्
    sanskrit: 'चलामो गृहमेवेति निर्भयो वाक्यमुच्चरेत् ।

      अनुज्ञां न च याचेत स्वयं मार्गं प्रदर्शयेत् ॥ ३ ॥

      '
  - verse_id: 4
    title_sa: अवरोधशान्तिः
    meter: अनुष्टुभ्
    sanskrit: 'क्षणमात्रं भवेद् वासः इति तस्यै निवेदयेत् ।

      अवरोधे समुत्पन्ने शान्त एव स आचरेत् ॥ ४ ॥

      '
- chapter_id: 7
  title_sa: अन्तिमावरोधप्रकरणम्
  verses:
  - verse_id: 1
    title_sa: अवरोध-सिद्धान्तः
    meter: अनुष्टुभ्
    sanskrit: 'अन्ते यदा भवेद् बाधा स्त्रीस्वभावात् न द्वेषतः ।

      प्रतापं वेदितुं सा हि कुरुतेऽन्तिमनिग्रहम् ॥ १ ॥

      '
  - verse_id: 2
    title_sa: सद्योविरामः
    meter: अनुष्टुभ्
    sanskrit: 'तदा क्रुद्धो न च भवेत् बलप्रयोगं विवर्जयेत् ।

      तत्क्षणादेव शान्तात्मा संस्पर्शं विनिवर्तयेत् ॥ २ ॥

      '
  - verse_id: 3
    title_sa: अवकाशसृजनम्
    meter: अनुष्टुभ्
    sanskrit: 'कथां चान्यां समारभ्य दूरीभूत्य प्रशान्तधीः ।

      प्राचुर्यं मानसे धृत्वा न कामं तत्र दर्शयेत् ॥ ३ ॥

      '
  - verse_id: 4
    title_sa: अन्तिमनिर्णयः
    meter: अनुष्टुभ्
    sanskrit: 'पुनराकर्षयेत् सा चेत् मन्दं मन्दं प्रवर्धयेत् ।

      दृढां बाधां विनिर्णीय त्यक्त्वा चेष्टां स तिष्ठति ॥ ४ ॥

      '
- chapter_id: 8
  title_sa: उत्तरसम्पर्कप्रकरणम्
  verses:
  - verse_id: 1
    title_sa: स्नेहप्रदर्शनम्
    meter: अनुष्टुभ्
    sanskrit: 'सुखस्य प्राप्तिकाले तु न कुर्यात् भावबन्धनम् ।

      स्नेहं दर्शयते प्राज्ञः न दैन्यं तत्र दर्शयेत् ॥ १ ॥

      '
  - verse_id: 2
    title_sa: प्रभात-निर्गमनम्
    meter: अनुष्टुभ्
    sanskrit: 'प्रभाते सत्वरं धीरः स्वकार्यं प्रति गच्छति ।

      नैव तस्यामधीनः स्यात् प्राचुर्यं मानसे धरन् ॥ २ ॥

      '
  - verse_id: 3
    title_sa: प्रतीक्षा-विधानम्
    meter: अनुष्टुभ्
    sanskrit: 'समागमस्य पश्चात् तु प्रतीक्षां कुरुते नरः ।

      सा चेत् स्वयमुपागच्छेत् तदा सङ्केतमाचरेत् ॥ ३ ॥

      '
- chapter_id: 9
  title_sa: बहुविकल्पप्रकरणम्
  verses:
  - verse_id: 1
    title_sa: प्राचुर्य-विधानम्
    meter: अनुष्टुभ्
    sanskrit: 'एकां नारीं न सेवेत प्राचुर्यं मानसे धरन् ।

      आसक्तिं दूरतो गच्छेत् स्वतन्त्रः स विचरति ॥ १ ॥

      '
  - verse_id: 2
    title_sa: समय-संयमनम्
    meter: अनुष्टुभ्
    sanskrit: 'सर्वाभ्यो न ददेत् कालं स्वकार्यं प्रथमं भवेत् ।

      विकल्पान् विविधान् दृष्ट्वा निरातङ्कः स जीवति ॥ २ ॥

      '
- chapter_id: 10
  title_sa: मन्त्रणाप्रकरणम्
  verses:
  - verse_id: 1
    title_sa: मूल्य-प्रतापः
    meter: अनुष्टुभ्
    sanskrit: 'याचको न भवेद् धीरः स्वमूल्यं वर्धयेत् सदा ।

      ग्राहकस्य भयेनैव न स्वपक्षं परित्यजेत् ॥ १ ॥

      '
  - verse_id: 2
    title_sa: निष्क्रमण-बलम्
    meter: अनुष्टुभ्
    sanskrit: 'यत्र सम्मानहानिः स्यात् तत्र कार्यं न चाचरेत् ।

      निष्क्रमेत् सङ्कटं त्यक्त्वा स्वाराज्ये स महीयते ॥ २ ॥

      '
