title_sa: मानवमति भ्रमः
title_en: Mānavamati bhramaḥ
subtitle_en: One hundred cognitive biases in Sanskrit (Amarakośa-style), fifty-verse outline in Anuṣṭubh
intro_visible: Opening in *vasantatilakā*, the work continues in *anuṣṭubh* on cognitive biases, grouped by theme. Each śloka is followed by an English gloss where given; *padaccheda*, *anvaya*, and *dhātvartha* are in the fold-out sections below.
stanzas:
- id: 1
  title: वसन्ततिलका-छन्दसि सङ्क्रमण-श्लोकः
  text_sa: 'प्रणम्य भारतीं देवीं त्यक्त्वा पूर्वं निदर्शनम् ।

    शतानां मतिदोषाणां ग्रथनं क्रियते मया ॥

    अमरकोशमार्गेण श्लोकेष्वेव निरन्तरम् ।

    पदच्छेदैः सान्वयैश्च प्रस्तूयन्ते भ्रमा नृणाम् ॥'
  translation: '?'
  padaccheda: यथा निर्दिष्टं, सर्वान् शतम् मतिभ्रमान् (१००) अमरकोशशैल्यां सङ्ग्रहीतुं ५०-श्लोकात्मिका योजना अत्र प्रस्तूयते। अत्र अनुष्टुभ्-छन्दसः प्रयोगः कृतः, यतः पारिभाषिकपदानां निरन्तरप्रवाहाय एतत् छन्दः सर्वोत्तमम्।
  anvaya: 'ग्राह्यम् त्याज्यं च: अत्र सर्वे १०० भ्रमाः ग्राह्याः, परन्तु पाश्चात्य-नामानि (Proper Nouns) संस्कृतधातुभिः संस्कृतानि, अथवा तेषां सार्वभौमिक-मनोवैज्ञानिक-तत्त्वेषु परिवर्तितानि।

    उदाहरणम्: ''IKEA Effect'' इत्यस्य कृते ''ऐक्या-मोहः'' (एकीकरणेन उत्पन्नः मोहः - Derived from ''Eka'' + ''Ṣyañ'' + attachment) इति वा ''स्वश्रमरागः'' इति वा प्रयोक्ष्यते।

    ''Barnum/Forer Effect'' इत्यस्य कृते ''भूरर-प्रभावः'' (भुवो राति इति भूररः - One who gives generic, earthy, universal statements to all) इति निर्मितम्।

    ''Parkinson''s Law of Triviality'' इत्यस्य कृते ''क्षुद्रविमर्शनीयता'' इति पदं प्रयुक्तम्।'
  dhatvartha: ज्ञातः (√ज्ञा + क्त), सृष्टः (√सृज् + क्त), रचितुम् (√रच् + तुमुन्), वाञ्छितम् (√वाञ्छ् + क्त), वदतु (√वद् + लोट्), उपदेष्टुम् (उप + √दिश् + तुमुन्) ।
- id: 2
  title: '१. निर्णयप्रकरणम् (निर्णय-व्यवहार-भ्रमाः): Decision Making- श्लोकः १'
  text_sa: 'प्रायः स्वस्य शुभं ध्यायेद्धानेर्दुःखं तु दुस्सहम् ।

    लाभाद् द्विगुणितं पुंसां स्वत्वे मोहोऽधिको भवेत् ॥'
  translation: Generally, one overestimates their own positive outcomes (Optimism Bias). The pain from loss is unbearable, twice as much as from gain (Loss Aversion). Men develop excessive delusion/attachment towards what they own (Endowment Effect).
  padaccheda: प्रायः स्वस्य शुभम् ध्यायेत् हानेः दुःखम् तु दुस्सहम् । लाभात् द्विगुणितम् पुंसाम् स्वत्वे मोहः अधिकः भवेत् ॥
  anvaya: प्रायः (नरः) स्वस्य शुभम् ध्यायेत् । हानेः दुःखम् तु दुस्सहम् (भवति) । लाभात् (तद्) द्विगुणितम् (भवति) । पुंसाम् स्वत्वे अधिकः मोहः भवेत् ॥
  dhatvartha: ध्यायेत् (√ध्यै चिन्तायाम्), हानेः (√हा त्यागे + नि), दुस्सहम् (दुर् + √सह् + खल्), लाभात् (√लभ् प्राप्तौ + घञ्), मोहः (√मुह् वैचित्त्ये + घञ्) ।
- id: 3
  title: १. निर्णयप्रकरणम् - श्लोकः २
  text_sa: 'गतद्रव्येऽधिकः सङ्गो नष्टकार्यानुवर्तनम् ।

    यथास्थितिरतिश्चैव पूर्वाङ्के पाशबन्धनम् ॥'
  translation: There is excessive attachment to resources already spent, leading to the continuation of a ruined endeavor (Sunk Cost Fallacy). There is a preference for the state exactly as it is (Status Quo Bias), and getting tied down by the first piece of information offered (Anchoring Effect).
  padaccheda: गत-द्रव्ये अधिकः सङ्गः नष्ट-कार्य-अनुवर्तनम् । यथा-स्थिति-रतिः च एव पूर्व-अङ्के पाश-बन्धनम् ॥
  anvaya: गतद्रव्ये अधिकः सङ्गः (भवति), (तस्मात्) नष्टकार्यानुवर्तनम् (क्रियते) । यथास्थितिरतिः च एव (भवति), पूर्वाङ्के पाशबन्धनम् (च भवति) ॥
  dhatvartha: गत (√गम् + क्त), सङ्गः (सम् + √गम् + अच्), नष्ट (√णश् अदर्शने + क्त), अनुवर्तनम् (अनु + √वृत् + ल्युट्), रतिः (√रम् + क्तिन्), बन्धनम् (√बन्ध् + ल्युट्) ।
- id: 4
  title: १. निर्णयप्रकरणम् - श्लोकः ३
  text_sa: 'रूपणाद् भिन्ननिष्कर्षो मायाभेदेन निश्चयः ।

    सद्योलोभोऽल्पलाभेऽपि शून्यसङ्कटवाञ्छनम् ॥'
  translation: Drawing different conclusions based on presentation (Framing Effect), changing preference due to a decoy (Decoy Effect). Desiring immediate, even if smaller, payoffs (Present Bias), and wanting the absolute elimination of risk (Zero-Risk Bias).
  padaccheda: रूपणात् भिन्न-निष्कर्षः माया-भेदेन निश्चयः । सद्यः-लोभः अल्प-लाभे अपि शून्य-सङ्कट-वाञ्छनम् ॥
  anvaya: रूपणात् भिन्ननिष्कर्षः (जायते), मायाभेदेन निश्चयः (परिवर्तते) । अल्पलाभे अपि सद्योलोभः (भवति), (तथा) शून्यसङ्कटवाञ्छनम् (भवति) ॥
  dhatvartha: रूपणात् (√रूप + ल्युट्), निष्कर्षः (निर् + √कृष् + घञ्), निश्चयः (निर् + √चि + अच्), लोभः (√लुभ् गार्ध्ये + घञ्), वाञ्छनम् (√वाञ्छ् इच्छायाम् + ल्युट्) ।
- id: 5
  title: '२. विश्वासतर्कप्रकरणम् -(विश्वास-तर्क-दोषाः): Belief & Logic श्लोकः ४'
  text_sa: 'स्वमतं पोषयेद्यत्तु तदेव शृणुते नरः ।

    प्रतीपदर्शनाद् भूयो दृढो भवति दुराग्रहः ॥'
  translation: A man listens only to that which nourishes his own opinion (Confirmation Bias). Upon seeing contradictory evidence, his stubbornness becomes even firmer (Backfire Effect).
  padaccheda: स्व-मतम् पोषयेत् यत् तु तत् एव शृणुते नरः । प्रतीप-दर्शनात् भूयः दृढः भवति दुराग्रहः ॥
  anvaya: यत् तु स्वमतम् पोषयेत्, नरः तत् एव शृणुते । प्रतीपदर्शनात् दुराग्रहः भूयः दृढः भवति ॥
  dhatvartha: पोषयेत् (√पुष् पुष्टौ + णिच्), शृणुते (√श्रु श्रवणे), दर्शनात् (√दृश् प्रेक्षणे + ल्युट्), दृढः (√दृंह् + क्त) ।
- id: 6
  title: २. विश्वासतर्कप्रकरणम् - श्लोकः ५
  text_sa: 'नवज्ञानेऽपि सिद्धान्तो जडत्वान्न विमुच्यते ।

    सेमल्विट्-प्रतिघश्चैव नवज्ञानविगर्हणम् ॥'
  translation: Even upon receiving new knowledge, the established doctrine is not released due to stubbornness (Belief Perseverance). The Semmelweis reflex is the reflexive condemnation of new knowledge.
  padaccheda: नव-ज्ञाने अपि सिद्धान्तः जडत्वात् न विमुच्यते । सेमल्विट्-प्रतिघः च एव नव-ज्ञान-विगर्हणम् ॥
  anvaya: नवज्ञाने (प्राप्ते) अपि जडत्वात् सिद्धान्तः न विमुच्यते । सेमल्विट्-प्रतिघः च एव नवज्ञानविगर्हणम् (भवति) ॥
  dhatvartha: विमुच्यते (वि + √मुच् मोक्षणे + कर्मणि लट्), प्रतिघः (प्रति + √हन् + अप्), विगर्हणम् (वि + √गर्ह् कुत्सायाम् + ल्युट्) ।
- id: 7
  title: २. विश्वासतर्कप्रकरणम् - श्लोकः ६
  text_sa: 'भये कपोतवृत्तिः स्यात् सामान्याङ्कविवर्जनम् ।

    विशिष्टेऽधिकसम्भाव्या भ्रमो ह्येकत्र मिलिते ॥'
  translation: In fear, one acts like a pigeon ignoring the threat (Ostrich Effect), discarding general statistics (Base Rate Fallacy). Assuming specific, combined conditions are more probable causes the conjunction delusion (Conjunction Fallacy).
  padaccheda: भये कपोत-वृत्तिः स्यात् सामान्य-अङ्क-विवर्जनम् । विशिष्टे अधिक-सम्भाव्या भ्रमः हि एकत्र मिलिते ॥
  anvaya: भये कपोतवृत्तिः स्यात्, (तथा) सामान्याङ्कविवर्जनम् (स्यात्) । एकत्र मिलिते विशिष्टे (सति) अधिकसम्भाव्या (इति) भ्रमः हि (भवति) ॥
  dhatvartha: वृत्तिः (√वृत् + क्तिन्), स्यात् (√अस् भुवि + विधिलिङ्), विवर्जनम् (वि + √वृज् + ल्युट्), मिलिते (√मिल् सङ्गमे + क्त) ।
- id: 8
  title: २. विश्वासतर्कप्रकरणम् - श्लोकः ७
  text_sa: 'द्यूतकारभ्रमश्चापि सिद्धहस्तस्य वञ्चना ।

    मिथ्यान्वयश्च भावानां यत्र सम्बन्धवर्जनम् ॥'
  translation: The delusion of the gambler (Gambler's Fallacy) and the deception of the 'accomplished hand' (Hot-Hand Fallacy). The false connection of variables where there is an absence of actual relation (Illusory Correlation).
  padaccheda: द्यूतकार-भ्रमः च अपि सिद्ध-हस्तस्य वञ्चना । मिथ्या-अन्वयः च भावानाम् यत्र सम्बन्ध-वर्जनम् ॥
  anvaya: द्यूतकारभ्रमः च अपि (भवति), सिद्धहस्तस्य वञ्चना (भवति) । यत्र सम्बन्धवर्जनम् (तत्र) भावानाम् मिथ्यान्वयः च (भवति) ॥
  dhatvartha: द्यूत (√दिव् क्रीडायाम् + क्त), वञ्चना (√वञ्च् प्रलम्भने + युच्), अन्वयः (अनु + √इ + अच्) ।
- id: 9
  title: '३. समाजसमूहप्रकरणम् -(समाज-समूह-वृत्तयः): Social Dynamics श्लोकः ८'
  text_sa: 'स्वपक्षपातो नियतं परेषामैक्यरूपता ।

    गड्डरिकाप्रवाहश्च लोकाचारानुवर्तनम् ॥'
  translation: There is constant favoritism towards one's own side (In-Group Favoritism), and perceiving outsiders as uniform (Out-Group Homogeneity). Following the flock to match the world's behavior is the flow of the sheep (Bandwagon Effect).
  padaccheda: स्व-पक्षपातः नियतम् परेषाम् ऐक्य-रूपता । गड्डरिका-प्रवाहः च लोक-आचार-अनुवर्तनम् ॥
  anvaya: नियतम् स्वपक्षपातः (भवति), परेषाम् ऐक्यरूपता (दृश्यते) । गड्डरिकाप्रवाहः च लोकाचारानुवर्तनम् (भवति) ॥
  dhatvartha: पातः (√पत् + घञ्), ऐक्य (एक + ष्यञ्), प्रवाहः (प्र + √वह् + घञ्) ।
- id: 10
  title: ३. समाजसमूहप्रकरणम् - श्लोकः ९
  text_sa: 'सङ्घान्ध्यं मन्त्रणाकाले भामण्डलविमोहनम् ।

    एकदोषेण सर्वत्र कलङ्कस्य विचिन्तनम् ॥'
  translation: Group blindness occurs during consultation (Groupthink). Delusion caused by a single positive trait's halo (Halo Effect), and thinking of a blemish everywhere due to a single flaw (Horn Effect).
  padaccheda: सङ्घ-अन्ध्यम् मन्त्रणा-काले भा-मण्डल-विमोहनम् । एक-दोषेण सर्वत्र कलङ्कस्य विचिन्तनम् ॥
  anvaya: मन्त्रणाकाले सङ्घान्ध्यम् (भवति) । भामण्डलविमोहनम् (भवति) । एकदोषेण सर्वत्र कलङ्कस्य विचिन्तनम् (च भवति) ॥
  dhatvartha: अन्ध्यम् (अन्ध + ष्यञ्), मन्त्रणा (√मन्त्र् गुप्तभाषणे + युच्), विमोहनम् (वि + √मुह् + णिच् + ल्युट्), विचिन्तनम् (वि + √चिन्त् + ल्युट्) ।
- id: 11
  title: ३. समाजसमूहप्रकरणम् - श्लोकः १०
  text_sa: 'सर्वे पश्यन्ति मामेव रङ्गमञ्चभ्रमो हि सः ।

    मम पक्षे जगत्सर्वं मिथ्या-सम्मति-विभ्रमः ॥'
  translation: '''Everyone is looking only at me'' is the illusion of the theater stage (Spotlight Effect). ''The whole world is on my side'' is the illusion of false consensus (False Consensus Effect).'
  padaccheda: सर्वे पश्यन्ति माम् एव रङ्गमञ्च-भ्रमः हि सः । मम पक्षे जगत् सर्वम् मिथ्या-सम्मति-विभ्रमः ॥
  anvaya: सर्वे माम् एव पश्यन्ति (इति) सः हि रङ्गमञ्चभ्रमः । सर्वम् जगत् मम पक्षे (अस्ति इति) मिथ्यासम्मतिविभ्रमः ॥
  dhatvartha: पश्यन्ति (√दृश् प्रेक्षणे + लट्), सम्मति (सम् + √मन् + क्तिन्), विभ्रमः (वि + √भ्रम् + घञ्) ।
- id: 12
  title: ३. समाजसमूहप्रकरणम् - श्लोकः ११
  text_sa: 'अन्तर्विरोधेऽपि जने बाह्यं मौनमनुव्रतम् ।

    अधिकारिप्रमाणत्वं तद्वाक्येऽन्धसमर्थनम् ॥'
  translation: Even when there is internal opposition, an external vow of silence is kept assuming others agree (Pluralistic Ignorance). Taking an authority figure as absolute proof leads to blind support of their words (Authority Bias).
  padaccheda: अन्तर्-विरोधे अपि जने बाह्यम् मौनम् अनुव्रतम् । अधिकारि-प्रमाणत्वम् तद्-वाक्ये अन्ध-समर्थनम् ॥
  anvaya: जने अन्तर्विरोधे अपि बाह्यम् मौनम् अनुव्रतम् (भवति) । अधिकारिप्रमाणत्वम् (मत्वा) तद्वाक्ये अन्धसमर्थनम् (क्रियते) ॥
  dhatvartha: विरोधे (वि + √रुध् + घञ्), अनुव्रतम् (अनु + √वृञ् + क्त), समर्थनम् (सम् + √अर्थ् + ल्युट्) ।
- id: 13
  title: ४. स्मृतिप्रकरणम् - (Memory) श्लोकः १२
  text_sa: 'सुलभा या भवेत्स्मृतिः सैव सत्येति निश्चयः ।

    प्रान्तोत्कर्षेण कार्यस्य सम्पूर्णं मापनं नृणाम् ॥'
  translation: The memory easily accessible is decided as the truth (Availability Heuristic). Complete measurement of an experience by men is judged by its peak and end (Peak-End Rule).
  padaccheda: सु-लभा या भवेत् स्मृतिः सा एव सत्या इति निश्चयः । प्रान्त-उत्कर्षेण कार्यस्य सम्पूर्णम् मापनम् नृणाम् ॥
  anvaya: या स्मृतिः सुलभा भवेत् सा एव सत्या इति निश्चयः (भवति) । कार्यस्य प्रान्तोत्कर्षेण नृणाम् सम्पूर्णम् मापनम् (भवति) ॥
  dhatvartha: सुलभा (सु + √लभ् + अच्), भवेत् (√भू + विधिलिङ्), स्मृतिः (√स्मृ + क्तिन्), उत्कर्षेण (उत् + √कृष् + घञ्), मापनम् (√मा + णिच् + ल्युट्) ।
- id: 14
  title: ४. स्मृतिप्रकरणम् - श्लोकः १३
  text_sa: 'पश्चात्तथ्येन विकृता स्मृतिर्भवति दुर्बला ।

    स्वचयनं सदा श्रेष्ठं ज्ञातपूर्वमिति भ्रमः ॥'
  translation: Memory becomes distorted and weak due to post-event facts (Misinformation Effect). One's own choice is always remembered as best (Choice-Supportive Bias). The delusion of 'It was known beforehand' (Hindsight Bias).
  padaccheda: पश्चात्-तथ्येन विकृता स्मृतिः भवति दुर्बला । स्व-चयनम् सदा श्रेष्ठम् ज्ञात-पूर्वम् इति भ्रमः ॥
  anvaya: पश्चात्तथ्येन विकृता स्मृतिः दुर्बला भवति । स्वचयनम् सदा श्रेष्ठम् (भवति) । ज्ञातपूर्वम् इति भ्रमः (च भवति) ॥
  dhatvartha: विकृता (वि + √कृ + क्त), चयनम् (√चि + ल्युट्), ज्ञात (√ज्ञा + क्त) ।
- id: 15
  title: ४. स्मृतिप्रकरणम् - श्लोकः १४
  text_sa: 'रम्यातीतं सदा भाति परकीयस्वकीयता ।

    गुग्गुलस्य प्रभावेण जालान्धविस्मृतिस्तथा ॥'
  translation: The past always appears beautiful (Rosy Retrospection). Treating another's idea as one's own (Cryptomnesia). The blind forgetfulness caused by the web, due to the effect of external search engines/Guggula (Google Effect).
  padaccheda: रम्य-अतीतम् सदा भाति परकीय-स्वकीयता । गुग्गुलस्य प्रभावेण जाल-अन्ध-विस्मृतिः तथा ॥
  anvaya: अतीतम् सदा रम्यम् भाति । परकीयस्वकीयता (भवति) । तथा गुग्गुलस्य प्रभावेण जालान्धविस्मृतिः (भवति) ॥
  dhatvartha: भाति (√भा दीप्तौ + लट्), विस्मृतिः (वि + √स्मृ + क्तिन्) ।
- id: 16
  title: ४. स्मृतिप्रकरणम् - श्लोकः १५
  text_sa: 'जैगार्णिकस्मृतिर्ज्ञेया अपूर्णकार्यचिन्तनम् ।

    आयासेन पठितं यत् तत्स्मृतौ दृढमाविशेत् ॥'
  translation: Constant thinking of uncompleted tasks should be known as the Zeigarnik memory (Zeigarnik Effect). That which is read with effort enters the memory firmly (Processing Difficulty Effect).
  padaccheda: जैगार्णिक-स्मृतिः ज्ञेया अपूर्ण-कार्य-चिन्तनम् । आयासेन पठितम् यत् तत् स्मृतौ दृढम् आविशेत् ॥
  anvaya: अपूर्णकार्यचिन्तनम् जैगार्णिकस्मृतिः ज्ञेया । यत् आयासेन पठितम् तत् स्मृतौ दृढम् आविशेत् ॥
  dhatvartha: ज्ञेया (√ज्ञा + यत्), चिन्तनम् (√चिन्त् + ल्युट्), पठितम् (√पठ् + क्त), आविशेत् (आ + √विश् + विधिलिङ्) ।
- id: 17
  title: ५. अहङ्कारप्रकरणम् - (Ego) श्लोकः १६
  text_sa: 'स्वयंश्रेयो ग्रहेत्पुमान् परदोषं प्रकल्पयेत् ।

    मिथ्यानियन्त्रणं चैव मूलगुणस्य विभ्रमः ॥'
  translation: A man grasps the credit for himself but assigns the fault to others (Self-Serving Bias). False control (Illusion of Control), and the fundamental attribution delusion (Fundamental Attribution Error).
  padaccheda: स्वयम् श्रेयः ग्रहेत् पुमान् पर-दोषम् प्रकल्पयेत् । मिथ्या-नियन्त्रणम् च एव मूल-गुणस्य विभ्रमः ॥
  anvaya: पुमान् स्वयम् श्रेयः ग्रहेत् (तथा) परदोषम् प्रकल्पयेत् । मिथ्यानियन्त्रणम् च एव (भवति), मूलगुणस्य विभ्रमः (भवति) ॥
  dhatvartha: ग्रहेत् (√ग्रह् + विधिलिङ्), प्रकल्पयेत् (प्र + √कृप् + णिच् + विधिलिङ्), नियन्त्रणम् (नि + √यन्त्र् + ल्युट्) ।
- id: 18
  title: ५. अहङ्कारप्रकरणम् - श्लोकः १७
  text_sa: 'कर्तृप्रेक्षकयोर्भेदो मिथ्योत्कर्षोऽतिगर्वितः ।

    अहङ्केन्द्रभ्रमश्चैव भूररस्य प्रभावना ॥'
  translation: The difference between doer and observer (Actor-Observer Bias). Overconfident false superiority (Illusory Superiority/Overconfidence Effect). The egocentric delusion (Egocentric Bias) and the manifestation of generic statements applying specifically to oneself (Barnum/Forer Effect).
  padaccheda: कर्तृ-प्रेक्षकयोः भेदः मिथ्या-उत्कर्षः अति-गर्वितः । अहम्-केन्द्र-भ्रमः च एव भूररस्य प्रभावना ॥
  anvaya: कर्तृप्रेक्षकयोः भेदः (भवति) । अतिगर्वितः मिथ्योत्कर्षः (भवति) । अहङ्केन्द्रभ्रमः च एव (भवति), भूररस्य प्रभावना (भवति) ॥
  dhatvartha: भेदः (√भिद् + घञ्), उत्कर्षः (उत् + √कृष् + घञ्), गर्वितः (√गर्व् + क्त), प्रभावना (प्र + √भू + णिच् + युच्) ।
- id: 19
  title: ५. अहङ्कारप्रकरणम् - श्लोकः १८
  text_sa: 'नात्रसृष्टमिति द्वेषः परकृतेषु वस्तुषु ।

    स्वदोषान्धत्वमेवात्र सर्वेषां सहजं भुवि ॥'
  translation: Aversion to things made by others, thinking 'It was not created here' (Not Invented Here Syndrome). Blindness to one's own flaws is natural to everyone on earth (Bias Blind Spot).
  padaccheda: न-अत्र-सृष्टम् इति द्वेषः पर-कृतेषु वस्तुषु । स्व-दोष-अन्धत्वम् एव अत्र सर्वेषाम् सहजम् भुवि ॥
  anvaya: परकृतेषु वस्तुषु 'अत्र न सृष्टम्' इति द्वेषः (भवति) । अत्र भुवि सर्वेषाम् स्वदोषान्धत्वम् एव सहजम् (अस्ति) ॥
  dhatvartha: सृष्टम् (√सृज् + क्त), द्वेषः (√द्विष् + घञ्), अन्धत्वम् (अन्ध + त्व), सहजम् (सह + √जन् + ड) ।
- id: 20
  title: ६. अवधानप्रकरणम् -(Attention) श्लोकः १९
  text_sa: 'जीवन्मात्रं जनः पश्येन्नष्टं सर्वं विमुञ्चति ।

    भद्रमहिनावभ्रमो नूतनावृत्तिदर्शनम् ॥'
  translation: A person sees only what has survived and discards all that is lost (Survivorship Bias). The Baader-Meinhof phenomenon is seeing the repetition of something newly learned (Frequency Illusion).
  padaccheda: जीवन्-मात्रम् जनः पश्येत् नष्टम् सर्वम् विमुञ्चति । भद्र-महिनाव-भ्रमः नूतन-आवृत्ति-दर्शनम् ॥
  anvaya: जनः जीवन्मात्रम् पश्येत्, नष्टम् सर्वम् विमुञ्चति । भद्रमहिनावभ्रमः (तु) नूतनावृत्तिदर्शनम् (अस्ति) ॥
  dhatvartha: जीवन् (√जीव् + शतृ), पश्येत् (√दृश् + विधिलिङ्), नष्टम् (√णश् + क्त), विमुञ्चति (वि + √मुच् + लट्), आवृत्ति (आ + √वृत् + क्तिन्) ।
- id: 21
  title: ६. अवधानप्रकरणम् - श्लोकः २०
  text_sa: 'अवधानस्य दोषः स्यात् स्थूलबिन्दुनरीक्षणम् ।

    एकबिन्दुग्रहश्चैव व्यर्थतथ्यतृषा नृणाम् ॥'
  translation: There is a flaw of attention (Attentional Bias), observing only the most prominent points (Salience Bias). Grasping onto a single point (Focusing Effect), and the thirst for useless facts (Information Bias).
  padaccheda: अवधानस्य दोषः स्यात् स्थूल-बिन्दु-नरीक्षणम् । एक-बिन्दु-ग्रहः च एव व्यर्थ-तथ्य-तृषा नृणाम् ॥
  anvaya: अवधानस्य दोषः स्यात् । स्थूलबिन्दुनरीक्षणम् (भवति) । एकबिन्दुग्रहः च एव (भवति), नृणाम् व्यर्थतथ्यतृषा (भवति) ॥
  dhatvartha: अवधानस्य (अव + √धा + ल्युट्), नरीक्षणम् (नि + √ईक्ष् + ल्युट्), ग्रहः (√ग्रह् + अच्), तृषा (√तृष् + अ) ।
- id: 22
  title: ६. अवधानप्रकरणम् - श्लोकः २१
  text_sa: 'सन्दिग्धवर्जनं चैव लोपपक्षपातः स्मृतः ।

    वैषम्यप्रभावश्चापि पारिदोलामुखागमः ॥'
  translation: Avoiding the ambiguous (Ambiguity Effect) and the bias towards omission/inaction (Omission Bias). The effect of contrast (Contrast Effect), and perceiving faces/patterns due to the mind swinging (Pareidolia).
  padaccheda: सन्दिग्ध-वर्जनम् च एव लोप-पक्षपातः स्मृतः । वैषम्य-प्रभावः च अपि पारिदोला-मुख-आगमः ॥
  anvaya: सन्दिग्धवर्जनम् च एव (भवति), लोपपक्षपातः स्मृतः । वैषम्यप्रभावः च अपि (भवति), पारिदोलामुखागमः (भवति) ॥
  dhatvartha: सन्दिग्ध (सम् + √दिह् + क्त), वर्जनम् (√वृज् + ल्युट्), लोप (√लुप् + घञ्), आगमः (आ + √गम् + अच्) ।
- id: 23
  title: ७. मूल्यप्रेरणाप्रकरणम् -(Motivation) श्लोकः २२
  text_sa: 'स्वश्रमनिर्मितेऽधिक्यं मूल्यस्य परिकल्प्यते ।

    उपकारकृतौ मैत्री स्वातन्त्र्यरक्षणाद्धठः ॥'
  translation: Value is imagined to be excessive in things made by one's own effort (IKEA Effect). Friendship arises upon doing a favor (Ben Franklin Effect). Stubborn resistance occurs to protect one's freedom of choice (Reactance).
  padaccheda: स्व-श्रम-निर्मिते अधिक्यम् मूल्यस्य परिकल्प्यते । उपकार-कृतौ मैत्री स्वातन्त्र्य-रक्षणात् हठः ॥
  anvaya: स्वश्रमनिर्मिते मूल्यस्य अधिक्यम् परिकल्प्यते । उपकारकृतौ मैत्री (जायते) । स्वातन्त्र्यरक्षणात् हठः (भवति) ॥
  dhatvartha: निर्मिते (निर् + √मा + क्त), परिकल्प्यते (परि + √कृप् + णिच् + कर्मणि लट्), रक्षणात् (√रक्ष् + ल्युट्) ।
- id: 24
  title: ७. मूल्यप्रेरणाप्रकरणम् - श्लोकः २३
  text_sa: 'कर्मणः फलसाम्यं च ह्येतन्न्याय्यं जगत् स्मृतम् ।

    यथाव्यवस्थारतिश्च सुकृते पापिकाऽनुज्ञा ॥'
  translation: The world is considered just, with an equality of action and its fruit (Just-World Hypothesis). Attachment to the system as it is (System Justification), and a good deed acting as permission for immoral acts (Moral Credential Effect).
  padaccheda: कर्मणः फल-साम्यम् च हि एतत् न्याय्यम् जगत् स्मृतम् । यथा-व्यवस्था-रतिः च सुकृते पापिका अनुज्ञा ॥
  anvaya: कर्मणः फलसाम्यम् (अस्ति) च एतत् जगत् न्याय्यम् स्मृतम् हि । यथाव्यवस्थारतिः च (भवति), सुकृते (सति) पापिका अनुज्ञा (भवति) ॥
  dhatvartha: साम्यम् (सम + ष्यञ्), न्याय्यम् (न्याय + यत्), व्यवस्था (वि + अव + √स्था + अ), अनुज्ञा (अनु + √ज्ञा + अ) ।
- id: 25
  title: ७. मूल्यप्रेरणाप्रकरणम् - श्लोकः २४
  text_sa: 'बाह्यप्रेरणया नाशो ह्यन्तर्निहिततुष्टये ।

    समूहे रूपवद्भाति आयासाद् वस्तुमूल्यकम् ॥'
  translation: External motivation causes the destruction of intrinsic satisfaction (Overjustification Effect). An individual appears more attractive in a group (Cheerleader Effect). The value of an object is derived from effort (Effort Heuristic).
  padaccheda: बाह्य-प्रेरणया नाशः हि अन्तर्-निहित-तुष्टये । समूहे रूपवत् भाति आयासात् वस्तु-मूल्यकम् ॥
  anvaya: बाह्यप्रेरणया अन्तर्निहिततुष्टये नाशः हि (भवति) । समूहे रूपवत् भाति । आयासात् वस्तुमूल्यकम् (भवति) ॥
  dhatvartha: प्रेरणया (प्र + √ईर् + णिच् + युच्), नाशः (√णश् + घञ्), निहित (नि + √धा + क्त), तुष्टये (√तुष् + क्तिन्), आयासात् (आ + √यस् + घञ्) ।
- id: 26
  title: ८. सौन्दर्यबोधप्रकरणम् -(Perception) श्लोकः २५
  text_sa: 'रूपवान् गुणवानिति विचित्रं स्मर्यते चिरम् ।

    शब्दाच्चित्रं वरं प्रोक्तं विविक्तं स्मर्यते दृढम् ॥'
  translation: Assuming the beautiful are also virtuous (Beauty Premium). The bizarre is remembered longer (Bizarreness Effect). A picture is better than words for memory (Picture Superiority Effect). That which stands out is remembered firmly (Von Restorff Effect).
  padaccheda: रूपवान् गुणवान् इति विचित्रम् स्मर्यते चिरम् । शब्दात् चित्रम् वरम् प्रोक्तम् विविक्तम् स्मर्यते दृढम् ॥
  anvaya: रूपवान् गुणवान् इति (भ्रमः) । विचित्रम् चिरम् स्मर्यते । शब्दात् चित्रम् वरम् प्रोक्तम् । विविक्तम् दृढम् स्मर्यते ॥
  dhatvartha: स्मर्यते (√स्मृ + कर्मणि लट्), प्रोक्तम् (प्र + √वच् + क्त), विविक्तम् (वि + √विच् + क्त) ।
- id: 27
  title: ८. सौन्दर्यबोधप्रकरणम् - श्लोकः २६
  text_sa: 'हास्यं छन्दोऽपि सत्यत्वं पृथक् त्वल्पं वरं भवेत् ।

    महासङ्ख्याग्रहे क्लेशः काललाभव्यतिक्रमः ॥'
  translation: Humor and rhyme are perceived as truth (Humor/Rhyme-as-Reason Effect). Evaluated separately, the lesser is considered better (Less-is-Better Effect). Difficulty grasping large numbers (Magnitude Encoding), misjudging time saved (Time-Saving Bias).
  padaccheda: हास्यम् छन्दः अपि सत्यत्वम् पृथक् तु अल्पम् वरम् भवेत् । महा-सङ्ख्या-ग्रहे क्लेशः काल-लाभ-व्यतिक्रमः ॥
  anvaya: हास्यम् छन्दः अपि सत्यत्वम् (मन्यते) । पृथक् (दृष्टे) तु अल्पम् वरम् भवेत् । महासङ्ख्याग्रहे क्लेशः (भवति), काललाभव्यतिक्रमः (भवति) ॥
  dhatvartha: हास्यम् (√हस् + ण्यत्), ग्रहे (√ग्रह् + अच्), क्लेशः (√क्लिश् + घञ्), व्यतिक्रमः (वि + अति + √क्रम् + घञ्) ।
- id: 28
  title: ८. सौन्दर्यबोधप्रकरणम् - श्लोकः २७
  text_sa: 'गुरुभेदापरिज्ञानं सौन्दर्यबोधसंशये ।

    एते हि मानसे दोषाः प्रत्यक्षे भ्रान्तिकारकाः ॥'
  translation: Inability to distinguish between large quantities in perception (Weber-Fechner Law). These mental flaws indeed cause illusions in perception.
  padaccheda: गुरु-भेद-अपरिज्ञानम् सौन्दर्य-बोध-संशये । एते हि मानसे दोषाः प्रत्यक्षे भ्रान्ति-कारकाः ॥
  anvaya: सौन्दर्यबोधसंशये गुरुभेदापरिज्ञानम् (भवति) । एते हि मानसे दोषाः प्रत्यक्षे भ्रान्तिकारकाः (सन्ति) ॥
  dhatvartha: परिज्ञानम् (परि + √ज्ञा + ल्युट्), बोध (√बुध् + घञ्), कारकाः (√कृ + ण्वुल्) ।
- id: 29
  title: ९. सङ्कटप्रकरणम् -(Risk Assessment) श्लोकः २८
  text_sa: 'सम्भाव्यतोपेक्षा चैव ह्यपूर्वापदनिह्नवः ।

    नैराश्यभ्रान्तिराधिक्यात् परिणामेन निर्णयः ॥'
  translation: Disregarding probability (Neglect of Probability), denial of a disaster never seen before (Normalcy Bias). Overestimating despair (Pessimism Bias), and judging a decision by its outcome (Outcome Bias).
  padaccheda: सम्भाव्यता-उपेक्षा च एव हि अपूर्व-आपद्-अपनिह्नवः । नैराश्य-भ्रान्तिः अधिक्यात् परिणामेन निर्णयः ॥
  anvaya: सम्भाव्यतोपेक्षा च एव हि अपूर्वापदनिह्नवः (भवति) । अधिक्यात् नैराश्यभ्रान्तिः (भवति), परिणामेन निर्णयः (च भवति) ॥
  dhatvartha: उपेक्षा (उप + √ईक्ष् + अ), निह्नवः (नि + √हु + अप्), भ्रान्तिः (√भ्रम् + क्तिन्), निर्णयः (निर् + √णी + अच्) ।
- id: 30
  title: ९. सङ्कटप्रकरणम् - श्लोकः २९
  text_sa: 'अल्पदृष्टान्ततो व्याप्तिः प्रमाणातिरेको भ्रमः ।

    मिथ्यानिश्चितता चैव हानिद्वेषाच्च विक्रयः ॥'
  translation: Broad generalization from a small sample (Hasty Generalization), the delusion of overestimating validity (Illusion of Validity). False certainty (Pseudocertainty Effect), and selling assets out of loss aversion (Disposition Effect).
  padaccheda: अल्प-दृष्टान्ततः व्याप्तिः प्रमाण-अतिरेकः भ्रमः । मिथ्या-निश्चितता च एव हानि-द्वेषात् च विक्रयः ॥
  anvaya: अल्पदृष्टान्ततः व्याप्तिः (भवति), प्रमाणातिरेकः भ्रमः (भवति) । मिथ्यानिश्चितता च एव (भवति), हानिद्वेषात् च विक्रयः (भवति) ॥
  dhatvartha: दृष्टान्ततः (√दृश् + क्त + अन्त + तसिल्), व्याप्तिः (वि + आ + √आप् + क्तिन्), अतिरेकः (अति + √रिच् + घञ्), विक्रयः (वि + √क्री + अच्) ।
- id: 31
  title: ९. सङ्कटप्रकरणम् - श्लोकः ३०
  text_sa: 'कुलसङ्ख्याविस्मृतिश्च खण्डयोगाल्पता तथा ।

    सङ्कटस्य विचारेषु मानवानां मतिभ्रमाः ॥'
  translation: Forgetting the total denominator (Denominator Neglect) and judging the whole to be less than the sum of its parts (Subadditivity Effect). These are the human delusions in assessing risk.
  padaccheda: कुल-सङ्ख्या-विस्मृतिः च खण्ड-योग-अल्पता तथा । सङ्कटस्य विचारेषु मानवानाम् मति-भ्रमाः ॥
  anvaya: कुलसङ्ख्याविस्मृतिः च तथा खण्डयोगाल्पता (भवति) । सङ्कटस्य विचारेषु मानवानाम् (एते) मतिभ्रमाः (सन्ति) ॥
  dhatvartha: विस्मृतिः (वि + √स्मृ + क्तिन्), योग (√युज् + घञ्), विचारेषु (वि + √चर् + घञ्) ।
- id: 32
  title: १०. तन्त्रप्रकरणम् -(Professional Bias) श्लोकः ३१
  text_sa: 'योजनाकालह्रस्वत्वं क्षुद्रकार्यविमर्शनम् ।

    यन्त्रे विश्वसनं गाढमज्ञदशाविस्मरणम् ॥'
  translation: Underestimating plan time (Planning Fallacy), disproportionate time on trivialities (Parkinson's Law of Triviality). Deep trust in automated systems (Automation Bias), forgetting the state of not knowing (Curse of Knowledge).
  padaccheda: योजना-काल-ह्रस्वत्वम् क्षुद्र-कार्य-विमर्शनम् । यन्त्रे विश्वसनम् गाढम् अज्ञ-दशा-विस्मरणम् ॥
  anvaya: योजनाकालह्रस्वत्वम् (भवति), क्षुद्रकार्यविमर्शनम् (भवति) । यन्त्रे गाढम् विश्वसनम् (भवति), अज्ञदशाविस्मरणम् (भवति) ॥
  dhatvartha: ह्रस्वत्वम् (ह्रस्व + त्व), विमर्शनम् (वि + √मृश् + ल्युट्), विश्वसनम् (वि + √श्वस् + ल्युट्), विस्मरणम् (वि + √स्मृ + ल्युट्) ।
- id: 33
  title: १०. तन्त्रप्रकरणम् - श्लोकः ३२
  text_sa: 'प्रेक्षकेण कृतो भेदो दृष्टत्वाच्च विवर्तनम् ।

    उच्चाशयोत्कर्षलाभः नीचाशापकर्षस्तथा ॥'
  translation: The influence caused by the observer (Observer-Expectancy Effect), altering behavior because of being seen (Hawthorne Effect). High expectations yielding improved performance (Pygmalion Effect), low expectations causing decreased performance (Golem Effect).
  padaccheda: प्रेक्षकेण कृतः भेदः दृष्टत्वात् च विवर्तनम् । उच्च-आशया उत्कर्ष-लाभः नीच-आशा-अपकर्षः तथा ॥
  anvaya: प्रेक्षकेण कृतः भेदः (भवति), दृष्टत्वात् च विवर्तनम् (भवति) । उच्चाशया उत्कर्षलाभः (भवति), तथा नीचाशापकर्षः (भवति) ॥
  dhatvartha: प्रेक्षकेण (प्र + √ईक्ष् + ण्वुल्), कृतः (√कृ + क्त), दृष्टत्वात् (√दृश् + क्त्वा + त्व), विवर्तनम् (वि + √वृत् + ल्युट्) ।
- id: 34
  title: १०. तन्त्रप्रकरणम् - श्लोकः ३३
  text_sa: 'स्वसंस्थारक्षणार्थाय समस्यारक्षणं नृणाम् ।

    सङ्ख्यामात्रप्रमाणत्वं तन्त्राणां दशमा भ्रमाः ॥'
  translation: People preserving the problem to protect their institution (Shirky's Principle). Making decisions based solely on quantitative metrics as absolute proof (McNamara Fallacy). These are the tenth chapter's systemic biases.
  padaccheda: स्व-संस्था-रक्षण-अर्थाय समस्या-रक्षणम् नृणाम् । सङ्ख्या-मात्र-प्रमाणत्वम् तन्त्राणाम् दशमाः भ्रमाः ॥
  anvaya: स्वसंस्थारक्षणार्थाय नृणाम् समस्यारक्षणम् (भवति) । सङ्ख्यामात्रप्रमाणत्वम् (भवति), (एते) तन्त्राणाम् दशमाः भ्रमाः (सन्ति) ॥
  dhatvartha: संस्था (सम् + √स्था + अ), रक्षण (√रक्ष् + ल्युट्), प्रमाणत्वम् (प्र + √मा + ल्युट् + त्व) ।
