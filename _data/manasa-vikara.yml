  श्लोकः ४ (युधिष्ठिरः - Yudhishthira)

  * पर्याय-आगमम् (Paryāya-āgamam) = पर्याय (Turn/Change of luck) + आगमम् (Arrival).
  * आशास्य (Āśāsya) = Hoping for (ल्यप् प्रत्ययः). Hoping for a change in mathematical luck (Gambler’s Fallacy).
