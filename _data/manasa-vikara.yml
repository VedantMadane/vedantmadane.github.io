appendix_glossary: |
  ## नूतन-शब्द-व्युत्पत्तिः (Glossary of Coined Pāṇinian Terms)

  १. सत्यपराङ्मुखत्वम् (The Ostrich Effect): 'सत्य' (Truth) तथा 'पराङ्मुख' (Averted). अज्ञानवाञ्छा इत्यर्थः। सत्यं दृष्ट्वा मुखगूहनम्।
  २. स्वपक्षपातः (In-Group Favoritism): 'स्व' (Own) + 'पक्ष' (Group/Side) + 'पात' (Inclination). पतति अस्मिन् इति पातः (घञ् प्रत्ययः)।
  ३. नष्टमूल्यानुबन्धः (Sunk Cost Fallacy): 'नष्ट' (Lost) + 'मूल्य' (Cost/Value) + 'अनुबन्ध' (Attachment/Binding). गते श्रमे मिथ्या-मोहः।
  ४. शून्यविपत्तिकाङ्क्षा (Zero-Risk Bias): 'शून्य' (Zero) + 'विपत्ति' (Risk) + 'काङ्क्षा' (Desire). सर्वभयोच्छेदवाञ्छा।
  ५. जीर्णधर्मरतिः (System Justification): 'जीर्ण' (Decayed/Old) + 'धर्म' (System/Arrangement) + 'रतिः' (Attachment). रूढिव्यवस्थाग्रहः।
  ६. अधिकारान्धता (Authority Bias): 'अधिकार' (Authority) + 'अन्धता' (Blindness). प्रभुवाक्यान्धानुसरणम्।
  ७. निष्क्रियत्वापराधः (Omission Bias): 'निष्क्रियत्व' (Inaction/Omission) एव 'अपराधः' (Moral failing). अकर्मदोषः।
  ८. पर्यायागमाशा / द्यूतभ्रान्तिः (Gambler's Fallacy): 'पर्याय' (Turn/Probability) + 'आगम' (Arrival) + 'आशा' (Hope). पुनः पुनः प्रयत्नेन भाग्यपरिवर्तनस्य गणितीय-भ्रमः।
  ९. यन्त्रवद्धर्मचर्या (Automation Bias): 'यन्त्रवत्' (Like an automaton) + 'धर्मचर्या' (Execution of duty). अन्तःप्रज्ञां विना केवलं नियमानुसारं वर्तनम्।
  १०. वचनविन्यासः (Framing Effect): 'वचन' (Words/Data) + 'विन्यासः' (Framing/Arrangement). वाक्-छलेन सत्यस्य रूपान्तरणम्।
  ११. अतिदर्पः (Overconfidence Effect): 'अति' (Extreme) + 'दर्पः' (Confidence/Pride).
  १२. क्षुद्रहेत्ववमानः (Illusion of Validity): 'क्षुद्र' (Minor) + 'हेतु' (Variables) + 'अवमानः' (Disregard). स्वल्प-कारणानाम् उपेक्षा-भ्रमः।
  १३. दृढमूलभ्रमः (Anchoring Effect): 'दृढ' (Firmly planted) + 'मूल' (Root/First information) + 'भ्रमः' (Bias). प्रथम-विचार-बन्धनम्।
  १४. सद्यःफललोभः (Present Bias): 'सद्यः' (Immediate/Present) + 'फल' (Reward) + 'लोभः' (Greed). भविष्यदन्धता (Blindness to the future consequences) इति अस्य परिणामः।
